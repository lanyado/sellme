gainst your resume…</tspan></text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.28;0.42" calcMode="discrete" dur="9s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="34" y="182" xml:space="preserve"><tspan fill="#FF7A6B" font-weight="700">✗ Blocked  </tspan><tspan fill="#ECEAF4">20 isn’t in anything you gave it.</tspan></text><animate attributeName="opacity" values="0;1" keyTimes="0;0.42" calcMode="discrete" dur="9s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="34" y="210" xml:space="preserve"><tspan fill="#FF7A6B">           Your resume says 6. </tspan><tspan fill="#8F8BA3">It won’t round up.</tspan></text><animate attributeName="opacity" values="0;1" keyTimes="0;0.45" calcMode="discrete" dur="9s" repeatCount="indefinite"/></g>
