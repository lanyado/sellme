<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
<text x="34" y="84" xml:space="preserve"><tspan fill="#8F8BA3"> Inbox </tspan><tspan fill="#8F8BA3"> </tspan><tspan fill="#8F8BA3"> Pipeline </tspan><tspan fill="#8F8BA3"> </tspan><tspan fill="#D0EF59" font-weight="700">[Chat]</tspan><tspan fill="#8F8BA3"> </tspan><tspan fill="#8F8BA3"> Agents </tspan><tspan fill="#8F8BA3"> </tspan><tspan fill="#8F8BA3"> Schedule </tspan></text>
<text x="34" y="110" xml:space="preserve"><tspan fill="#8F8BA3">Getting you hired: 1 call ahead, 3 talking · nothing needs you</tspan></text>
<text x="53.2" y="149" xml:space="preserve"><tspan fill="#ECEAF4" font-weight="700">You</tspan></text>
<text x="53.2" y="175" xml:space="preserve"><tspan fill="#ECEAF4">Anything new from Jack &amp; Jill?</tspan></text>
<text x="53.2" y="214" xml:space="preserve"><tspan fill="#D0EF59" font-weight="700">SELLME</tspan></text>
<text x="53.2" y="240" xml:space="preserve"><tspan fill="#ECEAF4">Two intros this morning. I said yes to both, they fit what you asked for.</tspan></text>
<g opacity="0"><text x="53.2" y="279" xml:space="preserve"><tspan fill="#ECEAF4" font-weight="700">You</tspan></text><text x="53.2" y="305" xml:space="preserve"><tspan fill="#ECEAF4">Which call should I prep for first?</tspan></text><animate attributeName="opacity" values="0;1" keyTimes="0;0.28" calcMode="discrete" dur="10s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="53.2" y="344" xml:space="preserve"><tspan fill="#D0EF59" font-weight="700">SELLME</tspan></text><animate attributeName="opacity" values="0;1" keyTimes="0;0.55" calcMode="discrete" dur="10s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="53.2" y="370" xml:space="preserve"><tspan fill="#ECEAF4">Northwind. It’s in two days, and it’s the Staff role at your floor.</tspan></text><animate attributeName="opacity" values="0;1" keyTimes="0;0.55" calcMode="discrete" dur="10s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="53.2" y="396" xml:space="preserve"><tspan fill="#ECEAF4">Your brief is ready: press </tspan><tspan fill="#D0EF59" font-weight="700">p</tspan><tspan fill="#ECEAF4"> on it. They’ll ask about the team you led:</tspan></text><animate attributeName="opacity" values="0;1" keyTimes="0;0.6000000000000001" calcMode="discrete" dur="10s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="53.2" y="422" xml:space="preserve"><tspan fill="#ECEAF4">six engineers, and the billing rewrite you shipped in four months.</tspan></text><animate attributeName="opacity" values="0;1" keyTimes="0;0.65" calcMode="discrete" dur="10s" repeatCount="indefinite"/></g>
